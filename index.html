<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Optical Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="pwa/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="pwa/icon.svg">
</head>
<body>
<header class="app-bar">
  <div class="app-bar-inner">
    <a class="app-title" href="#/">Optical Calculator</a>
    <span class="app-sub">머신비전 광학 계산</span>
  </div>
</header>
<main id="app"></main>

<script type="module">
  import { start } from './core/render.js';
  start();

  // 서비스 워커는 보안 컨텍스트(https 또는 localhost)에서만 등록된다.
  // LAN 의 http 주소로 열면 등록이 거부되므로 아예 시도하지 않는다. 계산 기능은 그대로 동작한다.
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
