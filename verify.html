<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공식 검증 — Optical Calculator</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 820px; }
  pre { font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  .pass { color: #1d9e75; }
  .fail { color: #e24b4a; font-weight: 600; }
  .head { color: var(--text-2); margin-top: 14px; display: block; }
  .note { color: var(--text-3); }
</style>
</head>
<body>
<header class="app-bar"><div class="app-bar-inner"><span class="app-title">공식 검증</span>
<span class="app-sub">계산 코어만 UI 없이 확인합니다</span></div></header>
<main><pre id="out"></pre></main>

<script type="module">
// 레지스트리를 거친 목록을 쓴다. 모드 없는 계산기도 단일 모드로 정규화되므로
// 항상 modes 로 접근할 수 있고, 정규화가 필드를 빠뜨리지 않는지도 함께 검증된다.
import { CALCULATORS } from './core/registry.js';

const out = document.getElementById('out');
let failed = 0;

const line = (cls, text) => {
  const s = document.createElement('span');
  s.className = cls;
  s.textContent = text + '\n';
  out.append(s);
};
const head = (t) => line('head', '\n' + t);

function check(label, actual, expected, tol = 0.01) {
  const ok = Number.isFinite(actual) && Math.abs(actual - expected) <= tol;
  if (!ok) failed++;
  line(ok ? 'pass' : 'fail',
    `${ok ? 'PASS' : 'FAIL'}  ${label}: ${Number(actual).toFixed(4)}  (기대 ${Number(expected).toFixed(4)})`);
}

const ALL = CALCULATORS;
const byId = (id) => ALL.find((c) => c.id === id);

// 엔코더가 픽셀보다 굵을 때 나오는 경고인지 확인한다.
const scalerWarnHasCoarse = (out) =>
  modeOf('encoder-resolution', 'scaler')
    .warn({ encoderUm: 200, imageUm: 18.3 }, out)
    .some((w) => w.text.includes('굵습니다'));
const modeOf = (id, mid) =>
  mid ? byId(id).modes.find((m) => m.id === mid) : byId(id).modes[0];

const cam = { wpx: 5120, hpx: 5120, pixelUm: 4.5, fNumber: 5.6, imageCircle: 0 };

head('[렌즈 선정 · 초점거리 구하기]  센서 23.04 mm 정사각, FOV 120×90, WD 300');
const vf = { ...cam, fovW: 120, fovH: 90, wd: 300 };
const of_ = modeOf('lens-select', 'f').compute(vf);
check('배율 m', of_.m, 23.04 / 120, 1e-9);
check('초점거리 f', of_.f, (300 * (23.04 / 120)) / (1 + 23.04 / 120));
check('실제 시야 가로', of_.actualFovW, 120, 1e-9);
check('실제 시야 세로', of_.actualFovH, 120, 1e-9);
check('해상도 µm/px', of_.umPerPx, 4.5 / (23.04 / 120));
line(of_._axis === '가로' ? 'pass' : 'fail', `${of_._axis === '가로' ? 'PASS' : 'FAIL'}  제약축: ${of_._axis} (기대 가로)`);
if (of_._axis !== '가로') failed++;
modeOf('lens-select', 'f').warn(vf, of_).forEach((w) => line('note', `      · ${w.level} — ${w.text}`));

head('[왕복 검증]  f 로 구한 값을 시야 모드에 넣으면 원래 FOV 가 나와야 한다');
const ofov = modeOf('lens-select', 'fov').compute({ ...cam, f: of_.f, wd: 300 });
check('시야 가로 복원', ofov.fovW, 120);
check('배율 복원', ofov.m, of_.m, 1e-9);

head('[왕복 검증]  f 로 구한 값을 작동거리 모드에 넣으면 원래 WD 가 나와야 한다');
const owd = modeOf('lens-select', 'wd').compute({ ...cam, f: of_.f, fovW: 120, fovH: 90 });
check('작동거리 복원', owd.wd, 300);

head('[피사계심도]  m 0.192, F5.6, 픽셀 4.5 µm, 착란원 ×2');
const vd = { m: 0.192, fNumber: 5.6, pixelUm: 4.5, cocMult: 2 };
const od = modeOf('dof').compute(vd);
check('허용 착란원 µm', od.coc, 9, 1e-9);
check('피사계심도 mm', od.dof, (2 * 5.6 * 9 * 1.192) / (0.192 * 0.192) / 1000);
// 초점심도는 유효 F수 기준이다. 2·N·c 로 두면 (1 + 배율) 만큼 작게 나온다.
check('초점심도 µm', od.focusDepth, 2 * 5.6 * 1.192 * 9, 1e-9);
check('초점심도 = 피사계심도 × 배율²', od.dof * 0.192 * 0.192 * 1000, od.focusDepth, 1e-6);
check('회절 스팟 µm', od.airy, 2.44 * 0.55 * 5.6 * 1.192);
modeOf('dof').warn(vd, od).forEach((w) => line('note', `      · ${w.level} — ${w.text}`));

head('[교차 검증]  렌즈 선정이 내놓은 심도와 DOF 계산기 결과가 같아야 한다');
check('심도 일치', of_.dof, od.dof, 1e-9);

head('[해상도 · 검출 한계]  FOV 120×90, 5120×5120 px, 판정 3 px');
const vr = { fovW: 120, fovH: 90, wpx: 5120, hpx: 5120, minPixels: 3 };
const or_ = modeOf('resolution').compute(vr);
check('가로 µm/px', or_.umPerPxW, (120 * 1000) / 5120);
check('세로 µm/px', or_.umPerPxH, (90 * 1000) / 5120);
check('검출 한계 µm', or_.detectLimit, ((120 * 1000) / 5120) * 3);
modeOf('resolution').warn(vr, or_).forEach((w) => line('note', `      · ${w.level} — ${w.text}`));

head('[경계 조건]  WD < f 는 결상 불가 조건이므로 위험 경고가 나와야 한다');
const bad = modeOf('lens-select', 'fov');
const vb = { ...cam, f: 50, wd: 40 };
const wb = bad.warn(vb, bad.compute(vb));
const hasDanger = wb.some((w) => w.level === 'danger');
if (!hasDanger) failed++;
line(hasDanger ? 'pass' : 'fail', `${hasDanger ? 'PASS' : 'FAIL'}  WD < f 위험 경고 발생`);

head('[초점심도]  센서측과 물체측은 배율² 로 이어져 있어야 한다');
const vfd = { m: 0.192, fNumber: 5.6, pixelUm: 4.5, cocMult: 2 };
const ofd = modeOf('focus-depth').compute(vfd);
check('유효 F수', ofd.effectiveN, 5.6 * 1.192, 1e-9);
check('초점심도 µm', ofd.focusDepth, 2 * 5.6 * 1.192 * 9, 1e-9);
check('초점심도 = 피사계심도 × 배율²', ofd.dof * 0.192 * 0.192 * 1000, ofd.focusDepth, 1e-6);
check('DOF 계산기와 일치', ofd.dof, modeOf('dof').compute(vfd).dof, 1e-9);

head('[유효 F수 · 회절]  F5.6, 배율 0.192, 550 nm');
const vap = { fNumber: 5.6, m: 0.192, pixelUm: 4.5, lambdaNm: 550 };
const oap = modeOf('aperture').compute(vap);
check('유효 F수', oap.effectiveN, 6.6752, 1e-4);
check('에어리 지름 µm', oap.airy, 2.44 * 0.55 * 6.6752, 1e-4);
check('차단 주파수 lp/mm', oap.cutoff, 1 / (0.00055 * 6.6752), 0.5);
check('상측 NA', oap.na, 1 / (2 * 6.6752), 1e-6);
check('배율 0 이면 유효 F수 = F수', modeOf('aperture').compute({ ...vap, m: 0 }).effectiveN, 5.6, 1e-9);

head('[박막렌즈 결상]  f 50, 물체거리 300');
const otl = modeOf('thin-lens', 'image').compute({ f: 50, a: 300 });
check('상거리', otl.b, (300 * 50) / 250, 1e-9);
check('배율', otl.m, 60 / 300, 1e-9);
check('1/a + 1/b = 1/f', 1 / 300 + 1 / otl.b, 1 / 50, 1e-12);

head('[박막렌즈 · 등배]  물체거리 2f 면 상거리도 2f, 배율 1');
const oeq = modeOf('thin-lens', 'image').compute({ f: 50, a: 100 });
check('상거리', oeq.b, 100, 1e-9);
check('배율', oeq.m, 1, 1e-12);

head('[박막렌즈 · 허상]  물체거리 < f 면 상거리가 음수여야 한다');
const ovi = modeOf('thin-lens', 'image').compute({ f: 50, a: 25 });
check('상거리 음수', ovi.b, -50, 1e-9);
line(ovi._virtual ? 'pass' : 'fail', `${ovi._virtual ? 'PASS' : 'FAIL'}  허상으로 판정`);
if (!ovi._virtual) failed++;

head('[박막렌즈 · 역방향]  상거리 모드로 구한 f 가 원래 값이어야 한다');
check('초점거리 복원', modeOf('thin-lens', 'focal').compute({ a: 300, b: otl.b }).f, 50, 1e-9);

head('[이미지 서클]  5120×5120, 4.5 µm → 대각 32.58 mm');
const oic = modeOf('image-circle').compute({ wpx: 5120, hpx: 5120, pixelUm: 4.5, circleDia: 35 });
check('센서 대각', oic.diag, (Math.hypot(5120, 5120) * 4.5) / 1000, 1e-9);
check('여유', oic.margin, 35 - oic.diag, 1e-9);
const icMode = modeOf('image-circle');
const icSmall = { wpx: 5120, hpx: 5120, pixelUm: 4.5, circleDia: 20 };
const wic = icMode.warn(icSmall, icMode.compute(icSmall));
line(wic.some((w) => w.level === 'danger') ? 'pass' : 'fail', `${wic.some((w) => w.level === 'danger') ? 'PASS' : 'FAIL'}  서클이 작으면 비네팅 경고`);
if (!wic.some((w) => w.level === 'danger')) failed++;

head('[익스텐션 튜브]  f 50 에 25 mm 튜브 → 배율 0.5 증가');
const oet = modeOf('extension-tube').compute({ f: 50, tube: 25, baseM: 0, fNumber: 5.6 });
check('추가 배율', oet.addedM, 0.5, 1e-12);
check('상거리', oet.imageDist, 50 * 1.5, 1e-9);
check('물체거리', oet.objectDist, (50 * 1.5) / 0.5, 1e-9);
check('광량 손실 stop', oet.lightLoss, 2 * Math.log2(1.5), 1e-9);
// 튜브 길이가 초점거리와 같으면 등배가 되고, 물체거리와 상거리가 모두 2f 다.
const oet1 = modeOf('extension-tube').compute({ f: 50, tube: 50, baseM: 0, fNumber: 5.6 });
check('등배에서 물체거리 = 2f', oet1.objectDist, 100, 1e-9);
check('등배에서 광량 손실 2 stop', oet1.lightLoss, 2, 1e-12);

head('[두 렌즈 조합]  밀착이면 굴절력이 단순히 더해진다');
const ocb = modeOf('lens-combination').compute({ f1: 100, f2: 200, d: 0 });
check('합성 초점거리', ocb.f, 1 / (1 / 100 + 1 / 200), 1e-9);
check('밀착이면 BFD = f', ocb.bfd, ocb.f, 1e-9);
// 간격이 f1 + f2 이면 무초점(afocal) 이라 굴절력이 0 이 된다.
const oaf = modeOf('lens-combination').compute({ f1: 100, f2: 200, d: 300 });
check('무초점 조합의 굴절력', oaf.power, 0, 1e-9);

head('[렌즈메이커]  BK7 양볼록, R 51.5 / −51.5');
const olm = modeOf('lens-maker').compute({ n: 1.5168, r1: 51.5, r2: -51.5, thickness: 0 });
check('초점거리', olm.f, 1 / ((1.5168 - 1) * (1 / 51.5 + 1 / 51.5)), 1e-9);
check('박막 근사와 동일', olm.thicknessEffect, 0, 1e-12);
// 평볼록: 뒷면이 평면(R=0 으로 입력)이면 f = R / (n − 1)
const opl = modeOf('lens-maker').compute({ n: 1.5, r1: 50, r2: 0, thickness: 0 });
check('평볼록 초점거리', opl.f, 50 / 0.5, 1e-9);

head('[센서 규격]  5120×5120, 4.5 µm');
const osf = modeOf('sensor-format', 'size').compute({ wpx: 5120, hpx: 5120, pixelUm: 4.5 });
check('센서 가로', osf.w, 23.04, 1e-9);
check('대각', osf.diag, Math.hypot(23.04, 23.04), 1e-9);
check('화소수 MP', osf.megapixel, 26.2144, 1e-6);
// 크기 모드로 구한 대각을 피치 모드에 넣으면 원래 피치가 나와야 한다.
check('픽셀 피치 복원',
  modeOf('sensor-format', 'pitch').compute({ diag: osf.diag, wpx: 5120, hpx: 5120 }).pixelUm, 4.5, 1e-9);

head('[데이터 레이트]  5120×5120, 8bit, 30 fps, GigE 115 MB/s');
const vdr = { wpx: 5120, hpx: 5120, bitDepth: 8, fps: 30, linkMBs: 115 };
const odr = modeOf('data-rate', 'rate').compute(vdr);
check('프레임당 MB', odr.frameMB, (5120 * 5120) / 1e6, 1e-9);
check('데이터 레이트 MB/s', odr.dataRate, ((5120 * 5120) / 1e6) * 30, 1e-6);
check('사용률 %', odr.usage, (odr.dataRate / 115) * 100, 1e-6);
// 링크 상한은 최대 fps 모드와 같은 값이어야 한다.
check('최대 fps 일치', odr.maxFps, modeOf('data-rate', 'fps').compute(vdr).maxFps, 1e-9);
check('12bit 이면 1.5배', modeOf('data-rate', 'rate').compute({ ...vdr, bitDepth: 12 }).dataRate, odr.dataRate * 1.5, 1e-6);
modeOf('data-rate', 'rate').warn(vdr, odr).forEach((w) => line('note', `      · ${w.level} — ${w.text}`));

head('[모션 블러]  100 mm/s, 노출 500 µs, 분해능 23.44 µm/px');
const vmb = { speed: 100, exposureUs: 500, umPerPx: 23.44, allowPx: 1 };
const omb = modeOf('motion-blur', 'blur').compute(vmb);
check('이동 거리 µm', omb.blurUm, 50, 1e-9);
check('블러 px', omb.blurPx, 50 / 23.44, 1e-9);
// 허용 노출로 다시 찍으면 블러가 정확히 허용치가 되어야 한다.
const omb2 = modeOf('motion-blur', 'blur').compute({ ...vmb, exposureUs: omb.maxExposureUs });
check('허용 노출에서 블러 = 허용치', omb2.blurPx, 1, 1e-9);
check('노출 모드와 일치', omb.maxExposureUs, modeOf('motion-blur', 'exposure').compute(vmb).maxExposureUs, 1e-9);

head('[라인스캔]  200 mm/s, 20 µm/line');
const olr = modeOf('line-rate').compute({ speed: 200, umPerLine: 20, widthPx: 8192, bitDepth: 8 });
check('라인레이트 lines/s', olr.lineRate, 10000, 1e-9);
check('라인 주기 µs', olr.linePeriodUs, 100, 1e-9);
check('스캔 폭 mm', olr.scanWidth, (8192 * 20) / 1000, 1e-9);
check('데이터 레이트 MB/s', olr.dataRate, (8192 * 10000) / 1e6, 1e-9);

head('[비닝 · ROI]  5120 세로 중 1024 행만, 비닝 2');
const obr = modeOf('binning-roi').compute({ wpx: 5120, hpx: 5120, roiH: 1024, bin: 2, baseFps: 30, pixelUm: 4.5 });
check('출력 가로', obr.outW, 2560, 1e-9);
check('출력 세로', obr.outH, 512, 1e-9);
check('속도 배수', obr.speedUp, 5120 / 512, 1e-9);
check('감도 배수', obr.sensitivity, 4, 1e-12);
check('실효 픽셀 크기', obr.effectivePitch, 9, 1e-12);
// 전체 읽기 + 비닝 없음이면 원래 fps 그대로여야 한다.
check('기본 조건에서 fps 유지',
  modeOf('binning-roi').compute({ wpx: 5120, hpx: 5120, roiH: 5120, bin: 1, baseFps: 30, pixelUm: 4.5 }).newFps, 30, 1e-9);

head('[롤링 셔터]  리드아웃 10 ms, 100 mm/s');
const ors = modeOf('rolling-shutter').compute({ readoutUs: 10000, speed: 100, umPerPx: 23.44, rows: 5120 });
check('어긋남 µm', ors.shiftUm, 1000, 1e-9);
check('어긋남 px', ors.shiftPx, 1000 / 23.44, 1e-9);
check('행당 시간 µs', ors.lineTimeUs, 10000 / 5120, 1e-12);
check('기울기 °', ors.skewDeg, (Math.atan(1000 / 23.44 / 5120) * 180) / Math.PI, 1e-9);

head('[다이나믹 레인지]  포화 10500 e⁻, 읽기 잡음 2.4 e⁻');
const odyn = modeOf('dynamic-range').compute({ fullWell: 10500, readNoise: 2.4, bitDepth: 12 });
check('DR dB', odyn.drDb, 20 * Math.log10(10500 / 2.4), 1e-9);
check('최대 SNR dB', odyn.maxSnrDb, 10 * Math.log10(10500), 1e-9);
check('필요 비트', odyn.neededBits, Math.log2(10500 / 2.4), 1e-9);

head('[노출 · 게인]  1000 µs → 250 µs 면 4배 보정');
const oeg = modeOf('exposure-gain').compute({ baseUs: 1000, targetUs: 250 });
check('보정 배수', oeg.factor, 4, 1e-12);
check('게인 dB', oeg.gainDb, 12.0412, 1e-4);
check('노출 단계', oeg.stops, 2, 1e-12);
check('SNR 저하 dB', oeg.snrLossDb, 6.0206, 1e-4);
check('SNR 비율', oeg.snrRatio, 0.5, 1e-12);

head('[초점심도 도해]  도해가 필요한 값을 모두 받아야 한다');
const ofdv = modeOf('focus-depth');
const ofdOut = ofdv.compute({ m: 0.192, fNumber: 5.6, pixelUm: 4.5, cocMult: 2 });
line(ofdv.diagram ? 'pass' : 'fail', `${ofdv.diagram ? 'PASS' : 'FAIL'}  초점심도에 도해가 붙어 있음`);
if (!ofdv.diagram) failed++;

head('[조도]  광도 100 cd, 거리 500 mm');
const oil = modeOf('illuminance', 'lux').compute({ intensity: 100, distance: 500, halfAngle: 30 });
check('조도 lux', oil.lux, 100 / 0.25, 1e-9);
check('입체각 sr', oil.solidAngle, 2 * Math.PI * (1 - Math.cos(Math.PI / 6)), 1e-9);
// 역방향: 이 조도를 목표로 넣으면 원래 광도가 나와야 한다.
check('광도 복원', modeOf('illuminance', 'intensity').compute({ lux: oil.lux, distance: 500, halfAngle: 30 }).intensity, 100, 1e-9);

head('[역제곱 법칙]  거리를 2배로 하면 1/4, 정확히 2 스톱');
const ois = modeOf('inverse-square').compute({ baseLux: 2000, baseDist: 300, newDist: 600 });
check('새 조도', ois.newLux, 500, 1e-9);
check('밝기 배수', ois.ratio, 0.25, 1e-12);
check('스톱 변화', ois.stops, -2, 1e-12);

head('[노출 조건 비교]  노출 1/4, 조리개 한 단 개방이면 서로 상쇄되지 않는다');
const oeb = modeOf('exposure-balance').compute({
  expBefore: 1000, expAfter: 250, fBefore: 5.6, fAfter: 2.8,
  luxBefore: 2000, luxAfter: 2000, gainBefore: 0, gainAfter: 0 });
check('노출 기여 stop', oeb.expStops, -2, 1e-12);
check('조리개 기여 stop', oeb.apertureStops, 2, 1e-12);
check('최종 배수', oeb.total, 1, 1e-12);
// 게인 6 dB 는 밝기 2배, 즉 1 스톱이다.
check('게인 6dB = 1 stop', modeOf('exposure-balance').compute({
  expBefore: 1000, expAfter: 1000, fBefore: 5.6, fAfter: 5.6,
  luxBefore: 2000, luxAfter: 2000, gainBefore: 0, gainAfter: 6.0206 }).gainStops, 1, 1e-4);

head('[스트로브]  200 µs × 30 Hz');
const ost = modeOf('strobe').compute({ pulseUs: 200, freqHz: 30, overdrive: 5 });
check('듀티 %', ost.dutyPct, 200e-6 * 30 * 100, 1e-12);
check('평균 부하', ost.load, 200e-6 * 30 * 5, 1e-12);
check('허용 오버드라이브', ost.maxOverdrive, 1 / (200e-6 * 30), 1e-9);

head('[스트로브 · 허용 펄스 폭]  오버드라이브 5배, 30 Hz');
const oslim = modeOf('strobe', 'limit').compute({ freqHz: 30, overdrive: 5, derate: 0.8 });
check('허용 듀티 %', oslim.maxDutyPct, 20, 1e-12);
check('최대 펄스 폭 µs', oslim.maxPulseUs, (1 / 5 / 30) * 1e6, 1e-6);
check('권장 펄스 폭 µs', oslim.safePulseUs, (1 / 5 / 30) * 1e6 * 0.8, 1e-6);
// 역방향: 권장 펄스 폭을 듀티 모드에 넣으면 평균 부하가 정확히 정격 여유가 되어야 한다.
check('권장 펄스 폭의 평균 부하 = 정격 여유',
  modeOf('strobe', 'duty').compute({ pulseUs: oslim.safePulseUs, freqHz: 30, overdrive: 5 }).load, 0.8, 1e-9);
check('최대 펄스 폭의 평균 부하 = 정격',
  modeOf('strobe', 'duty').compute({ pulseUs: oslim.maxPulseUs, freqHz: 30, overdrive: 5 }).load, 1, 1e-9);

head('[스트로브 타이밍]  카메라 20 µs / 노출 300 µs, 조명 30 µs / 펄스 200 µs');
const vst = { camDelayUs: 20, exposureUs: 300, lightDelayUs: 30, pulseUs: 200, jitterUs: 5 };
const ostim = modeOf('strobe-timing').compute(vst);
check('겹침 시간 µs', ostim.overlapUs, 200, 1e-12);
check('광량 취득률 %', ostim.captureRatio, 100, 1e-12);
check('앞 여유 µs', ostim.leadUs, 10, 1e-12);
check('뒤 여유 µs', ostim.tailUs, 90, 1e-12);
check('권장 조명 지연 µs', ostim.recommendedDelayUs, 20 + (300 - 200) / 2, 1e-12);
// 권장 지연을 넣으면 앞뒤 여유가 같아져야 한다.
const ostBal = modeOf('strobe-timing').compute({ ...vst, lightDelayUs: ostim.recommendedDelayUs });
check('권장 지연에서 앞뒤 여유 일치', ostBal.leadUs, ostBal.tailUs, 1e-12);
check('권장 지연에서도 취득률 100 %', ostBal.captureRatio, 100, 1e-12);
// 펄스가 노출 끝을 넘어가면 그만큼 버려진다.
const ostLate = modeOf('strobe-timing').compute({ ...vst, lightDelayUs: 250 });
check('늦은 펄스의 겹침 µs', ostLate.overlapUs, 320 - 250, 1e-12);
check('늦은 펄스의 취득률 %', ostLate.captureRatio, (70 / 200) * 100, 1e-12);
line(modeOf('strobe-timing').warn({ ...vst, lightDelayUs: 400 }, modeOf('strobe-timing').compute({ ...vst, lightDelayUs: 400 }))[0].level === 'danger' ? 'pass' : 'fail',
  '노출 밖으로 완전히 벗어나면 위험 경고');

head('[스트로브 모션 정지]  300 mm/s, 펄스 200 µs, 20 µm/px');
const osfrz = modeOf('strobe-freeze', 'blur').compute({ speed: 300, pulseUs: 200, umPerPx: 20, maxBlurPx: 0.5 });
check('블러 µm', osfrz.blurUm, (300 * 200) / 1000, 1e-12);
check('블러 px', osfrz.blurPx, 3, 1e-12);
check('허용 펄스 폭 µs', osfrz.maxPulseUs, (0.5 * 20 * 1000) / 300, 1e-9);
// 왕복: 필요 펄스 폭 모드가 내놓은 값을 다시 넣으면 허용 블러가 그대로 나와야 한다.
const ospul = modeOf('strobe-freeze', 'pulse').compute({ speed: 300, umPerPx: 20, maxBlurPx: 0.5, baseExpUs: 2000 });
check('필요 펄스 폭 µs', ospul.pulseUs, osfrz.maxPulseUs, 1e-9);
check('그 펄스에서 블러 px',
  modeOf('strobe-freeze', 'blur').compute({ speed: 300, pulseUs: ospul.pulseUs, umPerPx: 20, maxBlurPx: 0.5 }).blurPx, 0.5, 1e-9);
check('필요 오버드라이브', ospul.needOverdrive, 2000 / ospul.pulseUs, 1e-9);
// 카메라 대분류의 모션 블러와 같은 식이어야 한다. 스트로브는 노출 자리에 펄스 폭이 들어간다.
check('모션 블러 계산기와 일치',
  osfrz.blurPx, modeOf('motion-blur', 'blur').compute({ speed: 300, exposureUs: 200, umPerPx: 20, allowPx: 0.5 }).blurPx, 1e-9);

head('[스트로브 광량]  연속광 노출 2000 µs → 펄스 200 µs, 30 Hz');
const osovr = modeOf('strobe-exposure', 'overdrive').compute({ contExpUs: 2000, pulseUs: 200, freqHz: 30 });
check('필요 오버드라이브', osovr.needOverdrive, 10, 1e-12);
check('메워야 할 밝기 stop', osovr.needStops, Math.log2(10), 1e-12);
check('듀티 %', osovr.dutyPct, 200e-6 * 30 * 100, 1e-12);
// 듀티 계산기가 내놓는 허용 배수와 같아야 한다.
check('허용 배수 = 듀티 계산기 값',
  osovr.maxOverdrive, modeOf('strobe', 'duty').compute({ pulseUs: 200, freqHz: 30, overdrive: 5 }).maxOverdrive, 1e-9);
check('그때의 평균 부하', osovr.loadAtNeed, 200e-6 * 30 * 10, 1e-12);

head('[주변광]  스트로브 20000 lux × 200 µs vs 주변광 500 lux × 1000 µs');
const osamb = modeOf('strobe-exposure', 'ambient').compute({ strobeLux: 20000, pulseUs: 200, ambientLux: 500, exposureUs: 1000 });
check('스트로브 노출량 lux·ms', osamb.signal, 20000 * 0.2, 1e-9);
check('주변광 노출량 lux·ms', osamb.ambient, 500 * 1, 1e-9);
check('신호 대 주변광비', osamb.ratio, 8, 1e-12);
check('주변광 기여율 %', osamb.ambientPct, (0.5 / 4.5) * 100, 1e-9);
// 노출을 펄스에 맞추면 주변광이 시간비만큼 줄어든다.
check('노출 단축 시 비율', osamb.bestRatio, 8 * (1000 / 200), 1e-9);
check('노출 = 펄스면 개선 여지 없음',
  modeOf('strobe-exposure', 'ambient').compute({ strobeLux: 20000, pulseUs: 200, ambientLux: 500, exposureUs: 200 }).ratio,
  osamb.bestRatio, 1e-9);

head('[LED 발열]  3.2 V × 3.5 A, 듀티 0.6 %, 열저항 8 °C/W');
const oledt = modeOf('led-thermal').compute({ vf: 3.2, ifPeak: 3.5, dutyPct: 0.6, rth: 8, ta: 25, tjMax: 125, effPct: 30, tempCoef: -0.5 });
check('피크 전력 W', oledt.peakW, 3.2 * 3.5, 1e-12);
check('평균 전력 W', oledt.avgW, 3.2 * 3.5 * 0.006, 1e-12);
check('발열 W', oledt.heatW, 3.2 * 3.5 * 0.006 * 0.7, 1e-12);
check('온도 상승 °C', oledt.riseC, 3.2 * 3.5 * 0.006 * 0.7 * 8, 1e-9);
check('정션 온도 °C', oledt.tj, 25 + 3.2 * 3.5 * 0.006 * 0.7 * 8, 1e-9);
check('한계까지 여유 °C', oledt.marginC, 125 - oledt.tj, 1e-9);
check('상대 광출력 %', oledt.relOutput, (1 - 0.005 * (oledt.tj - 25)) * 100, 1e-9);
// 효율을 0 으로 두면 전력이 전부 열이 되는 보수적 계산이다.
check('효율 0 이면 발열 = 평균 전력',
  modeOf('led-thermal').compute({ vf: 3.2, ifPeak: 3.5, dutyPct: 0.6, rth: 8, ta: 25, tjMax: 125, effPct: 0, tempCoef: -0.5 }).heatW,
  oledt.avgW, 1e-12);
// 듀티를 4배로 하면 온도 상승도 정확히 4배여야 한다.
check('듀티 4배면 온도 상승 4배',
  modeOf('led-thermal').compute({ vf: 3.2, ifPeak: 3.5, dutyPct: 2.4, rth: 8, ta: 25, tjMax: 125, effPct: 30, tempCoef: -0.5 }).riseC,
  oledt.riseC * 4, 1e-9);

head('[조사 영역]  발광부 50 mm, 반각 30°, 거리 300 mm');
const olc = modeOf('light-coverage').compute({ emitterMm: 50, halfAngle: 30, distance: 300, fovW: 120 });
check('조사 지름', olc.coverage, 50 + 2 * 300 * Math.tan(Math.PI / 6), 1e-9);
check('시야 끝 각도', olc.edgeAngle, (Math.atan(60 / 300) * 180) / Math.PI, 1e-9);
check('가장자리 조도비 %', olc.edgeRatio, Math.cos(Math.atan(60 / 300)) ** 4 * 100, 1e-9);

head('[화각]  렌즈 선정 계산기와 시야가 일치해야 한다');
const vav = { wpx: 5120, hpx: 5120, pixelUm: 4.5, f: 50, wd: 300 };
const oav = modeOf('angle-of-view').compute(vav);
const ofovCheck = modeOf('lens-select', 'fov').compute({ ...cam, f: 50, wd: 300 });
check('시야 가로 일치', oav.fovW, ofovCheck.fovW, 1e-9);
check('수평 화각', oav.aovH, 2 * (Math.atan(oav.fovW / 2 / 300) * 180) / Math.PI, 1e-9);
check('무한원 기준 화각', oav.aovInf, 2 * (Math.atan(23.04 / 2 / 50) * 180) / Math.PI, 1e-9);

head('[픽셀 캘리브레이션]  50 mm 가 2133 px');
const opc = modeOf('pixel-calibration').compute({ refMm: 50, refPx: 2133, measuredPx: 2133, edgeErrorPx: 0.5 });
check('축척 mm/px', opc.scaleMm, 50 / 2133, 1e-12);
check('기준 픽셀을 다시 넣으면 기준 실측', opc.measuredMm, 50, 1e-9);
check('불확실도 mm', opc.toleranceMm, (2 * 0.5 * 50) / 2133, 1e-12);

head('[원근 오차]  WD 300, 높이차 5 mm, 길이 50 mm');
const ope = modeOf('perspective-error').compute({ wd: 300, heightMm: 5, lengthMm: 50, umPerPx: 23.44 });
check('크기 변화율 %', ope.scalePct, (5 / 300) * 100, 1e-12);
check('측정 오차 mm', ope.errorMm, 50 * (5 / 300), 1e-12);
// 허용 높이차를 넣으면 오차가 정확히 1 px 이어야 한다.
const ope1 = modeOf('perspective-error').compute({ wd: 300, heightMm: ope.allowHeightMm, lengthMm: 50, umPerPx: 23.44 });
check('허용 높이차에서 오차 = 1 px', ope1.errorPx, 1, 1e-9);

head('[텔레센트릭]  0.1°, 높이차 5 mm');
const ote = modeOf('telecentric').compute({ telecentricityDeg: 0.1, heightMm: 5, umPerPx: 23.44, wd: 300, lengthMm: 50 });
check('오차 mm', ote.errorMm, 2 * 5 * Math.tan((0.1 * Math.PI) / 180), 1e-12);
check('일반 렌즈 비교값', ote.normalErrorMm, ope.errorMm, 1e-12);

head('[카메라 경사]  2°, WD 300, 시야 120');
const oct = modeOf('camera-tilt').compute({ tiltDeg: 2, wd: 300, fovW: 120, umPerPx: 23.44 });
check('양끝 거리차', oct.wdDiff, 120 * Math.sin((2 * Math.PI) / 180), 1e-12);
check('근거리 + 원거리 = 2 × WD', oct.nearWd + oct.farWd, 600, 1e-9);
check('필요 심도 = 거리차', oct.neededDof, oct.wdDiff, 1e-12);

head('[스넬 법칙]  공기 → 유리 1.52, 입사 30°');
const osn = modeOf('snell').compute({ n1: 1, n2: 1.52, theta1: 30 });
check('굴절각', osn.theta2, (Math.asin(Math.sin(Math.PI / 6) / 1.52) * 180) / Math.PI, 1e-9);
check('수직 입사 반사율 %', osn.normalPct, ((0.52 / 2.52) ** 2) * 100, 1e-9);
// 수직 입사에서는 프레넬 식이 수직 반사율과 같아야 한다.
check('0° 에서 두 식 일치', modeOf('snell').compute({ n1: 1, n2: 1.52, theta1: 0 }).reflectancePct, osn.normalPct, 1e-6);

head('[임계각]  유리 1.52 → 공기');
const oca = modeOf('critical-angle').compute({ n1: 1.52, n2: 1.0 });
check('임계각', oca.critical, (Math.asin(1 / 1.52) * 180) / Math.PI, 1e-9);
check('브루스터각', oca.brewster, (Math.atan(1 / 1.52) * 180) / Math.PI, 1e-9);
// 임계각으로 입사시키면 스넬 계산에서 전반사가 나와야 한다.
const otir = modeOf('snell').compute({ n1: 1.52, n2: 1.0, theta1: oca.critical + 0.5 });
line(otir._total ? 'pass' : 'fail', `${otir._total ? 'PASS' : 'FAIL'}  임계각 초과 시 전반사 판정`);
if (!otir._total) failed++;

head('[평행판]  유리 3 mm, n 1.52, 수직 입사');
const opp = modeOf('plane-plate').compute({ thickness: 3, n: 1.52, theta1: 0, dofMm: 3.26 });
check('초점 이동', opp.focusShift, 3 * (1 - 1 / 1.52), 1e-12);
check('수직 입사면 측면 변위 0', opp.lateralShift, 0, 1e-12);
check('광로 = 두께', opp.pathLength, 3, 1e-12);
const oppTilt = modeOf('plane-plate').compute({ thickness: 3, n: 1.52, theta1: 45, dofMm: 3.26 });
line(oppTilt.lateralShift > 0 ? 'pass' : 'fail', `${oppTilt.lateralShift > 0 ? 'PASS' : 'FAIL'}  기울이면 측면 변위 발생 (${oppTilt.lateralShift.toFixed(4)} mm)`);
if (!(oppTilt.lateralShift > 0)) failed++;

head('[회절격자]  600 lines/mm, 550 nm, 1차');
const ogr = modeOf('grating').compute({ linesPerMm: 600, lambdaNm: 550, order: 1, incidenceDeg: 0 });
check('격자 주기 µm', ogr.periodUm, 1000 / 600, 1e-12);
check('1차 회절각', ogr.diffractionDeg, (Math.asin(0.55 / (1000 / 600)) * 180) / Math.PI, 1e-9);
check('0차는 직진', modeOf('grating').compute({ linesPerMm: 600, lambdaNm: 550, order: 0, incidenceDeg: 0 }).diffractionDeg, 0, 1e-12);

head('[엔코더 · 스케일러]  분해능을 알 때 — 200 µm/pulse, 픽셀 18.3 µm');
const osc = modeOf('encoder-resolution', 'scaler').compute({ encoderUm: 200, imageUm: 18.3 });
check('스케일러', osc.scaler, 200 / 18.3, 1e-9);
line(Math.abs(osc.scaler - 10.928) < 0.001 ? 'pass' : 'fail',
  `${Math.abs(osc.scaler - 10.928) < 0.001 ? 'PASS' : 'FAIL'}  현장 계산서 값 10.928 과 일치 (${osc.scaler.toFixed(3)})`);
if (!(Math.abs(osc.scaler - 10.928) < 0.001)) failed++;
// 엔코더가 픽셀보다 굵으면 분주비가 1 미만이라 나눠 찍을 수 없다.
check('분주비', osc.divider, 18.3 / 200, 1e-12);
line(scalerWarnHasCoarse(osc) ? 'pass' : 'fail',
  `${scalerWarnHasCoarse(osc) ? 'PASS' : 'FAIL'}  엔코더가 픽셀보다 굵으면 경고`);
if (!scalerWarnHasCoarse(osc)) failed++;

head('[엔코더 · 스케일러]  엔코더가 조밀할 때 — 2 µm/pulse, 픽셀 18.3 µm');
const osc2 = modeOf('encoder-resolution', 'scaler').compute({ encoderUm: 2, imageUm: 18.3 });
check('분주비', osc2.divider, 9.15, 1e-9);
check('반올림 분주비', osc2.dividerRound, 9, 0);
check('반내림 분주비', osc2.dividerFloor, 9, 0);
check('반올림 시 Y 분해능', osc2.yUmRound, 18, 1e-12);
// 분주비가 정수로 떨어지면 Y 분해능이 이미지 분해능과 정확히 같아야 한다.
const oscInt = modeOf('encoder-resolution', 'scaler').compute({ encoderUm: 2, imageUm: 18 });
check('정수 분주비에서 Y = 이미지 분해능', oscInt.yUmRound, 18, 1e-12);
// 분주비 계산기와 같은 값을 내야 한다. 두 화면이 다른 답을 주면 안 된다.
check('분주비 계산기와 일치', osc2.divider,
  modeOf('trigger-divider').compute({ imageUm: 18.3, encoderUm: 2, speedMmS: 300, guardUs: 0.1, timerNs: 20 }).divider, 1e-12);

head('[엔코더 · 실측]  0 mm/0 pulse → 100 mm/500 pulse');
const vpos = { mmBefore: 0, pulseBefore: 0, mmAfter: 100, pulseAfter: 500, imageUm: 18.3 };
const opos = modeOf('encoder-resolution', 'position').compute(vpos);
check('이동량 mm', opos.travelMm, 100, 1e-12);
check('펄스 변화량', opos.pulseDelta, 500, 1e-12);
check('엔코더 분해능 µm', opos.encoderUm, 200, 1e-9);
// 실측으로 구한 분해능을 스케일러 모드에 넣으면 같은 스케일러가 나와야 한다.
check('스케일러 모드와 일치', opos.scaler,
  modeOf('encoder-resolution', 'scaler').compute({ encoderUm: opos.encoderUm, imageUm: 18.3 }).scaler, 1e-12);
// 0 이 아닌 좌표에서 시작해도 차이만 쓰므로 결과가 같아야 한다.
check('오프셋이 있어도 동일',
  modeOf('encoder-resolution', 'position').compute({ mmBefore: 250, pulseBefore: 8000, mmAfter: 350, pulseAfter: 8500, imageUm: 18.3 }).encoderUm,
  200, 1e-9);
// 되돌아오는 방향으로 재도 분해능은 같고, 방향 반대는 따로 잡아야 한다.
const vrev = { mmBefore: 0, pulseBefore: 0, mmAfter: 100, pulseAfter: -500, imageUm: 18.3 };
const orev = modeOf('encoder-resolution', 'position').compute(vrev);
check('역방향에서도 분해능 동일', orev.encoderUm, 200, 1e-9);
const wrev = modeOf('encoder-resolution', 'position').warn(vrev, orev);
line(wrev.some((w) => w.text.includes('반대')) ? 'pass' : 'fail',
  `${wrev.some((w) => w.text.includes('반대')) ? 'PASS' : 'FAIL'}  계수 방향이 반대일 때 경고`);
if (!wrev.some((w) => w.text.includes('반대'))) failed++;
const vzero = { mmBefore: 10, pulseBefore: 100, mmAfter: 10, pulseAfter: 100, imageUm: 18.3 };
const wzero = modeOf('encoder-resolution', 'position').warn(vzero, modeOf('encoder-resolution', 'position').compute(vzero));
line(wzero.some((w) => w.level === 'danger') ? 'pass' : 'fail',
  `${wzero.some((w) => w.level === 'danger') ? 'PASS' : 'FAIL'}  두 지점이 같으면 위험 경고`);
if (!wzero.some((w) => w.level === 'danger')) failed++;

head('[엔코더 · 로터리]  롤러 48 mm, 5000 PPR 4체배');
const oer = modeOf('encoder-resolution', 'rotary').compute({ rollerMm: 48, ppr: 5000, multiplier: 4, imageUm: 42 });
check('총 펄스', oer.totalPulses, 20000, 1e-9);
check('엔코더 분해능 µm', oer.encoderUm, (48000 * Math.PI) / 20000, 1e-12);
// 엑셀 시트는 원주율 3.14 를 써서 7.536 이 나온다. π 로 계산하면 7.5398 이다.
line(Math.abs(oer.encoderUm - 7.54) < 0.01 ? 'pass' : 'fail',
  `${Math.abs(oer.encoderUm - 7.54) < 0.01 ? 'PASS' : 'FAIL'}  시트의 7.54 µm 와 일치 (${oer.encoderUm.toFixed(4)})`);
if (!(Math.abs(oer.encoderUm - 7.54) < 0.01)) failed++;

head('[엔코더 · 필요 사양]  역방향 — 구한 PPR 을 넣으면 목표 분해능이 나와야 한다');
const oreq = modeOf('encoder-resolution', 'required').compute({ rollerMm: 48, targetUm: 7.5398, multiplier: 4 });
check('필요 PPR', oreq.requiredPpr, 5000, 1);
check('역산 분해능', modeOf('encoder-resolution', 'rotary')
  .compute({ rollerMm: 48, ppr: oreq.requiredPpr, multiplier: 4, imageUm: 42 }).encoderUm, 7.5398, 1e-3);

head('[분주비 · 트리거]  이미지 18 µm, 엔코더 2 µm, 300 mm/s');
const vtd = { imageUm: 18, encoderUm: 2, speedMmS: 300, guardUs: 0.1, timerNs: 20 };
const otd = modeOf('trigger-divider').compute(vtd);
check('분주비', otd.divider, 9, 1e-12);
check('최대주파수 Hz', otd.maxFreqHz, 150000, 1e-9);
check('엔코더 주기 µs', otd.periodUs, 1e6 / 150000, 1e-12);
check('트리거 유효 펄스폭 µs', otd.pulseWidthUs, 1e6 / 150000 - 0.1, 1e-12);
// 현장 계산서는 6.66 으로 반올림해 328 이 나온다. 반올림 없이 계산하면 328.3 -> 버림 328.
check('펄스폭 설정값', otd.pwSetting, 328, 0);
check('딜레이', otd.delay, 0, 0);
check('분주비 정수면 Y 분해능 = 이미지 분해능', otd.yUmRound, 18, 1e-12);

head('[분주비 · 시트 조건]  이미지 18.3 µm, 엔코더 0.5 µm, 300 mm/s');
const osheet = modeOf('trigger-divider').compute({ imageUm: 18.3, encoderUm: 0.5, speedMmS: 300, guardUs: 0.1, timerNs: 20 });
check('분주비', osheet.divider, 36.6, 1e-9);
check('최대주파수 Hz', osheet.maxFreqHz, 600000, 1e-9);
check('엔코더 주기 µs', osheet.periodUs, 1 / 600000 * 1e6, 1e-12);
check('트리거 유효 펄스폭 µs', osheet.pulseWidthUs, 1.5666666666666667, 1e-9);
check('펄스폭 설정값', osheet.pwSetting, Math.floor(1.5666666666666667 * 1000 / 20), 0);
check('반내림 분주비', osheet.dividerFloor, 36, 0);
check('반올림 분주비', osheet.dividerRound, 37, 0);

head('[분주비 · 로터리 조건]  이미지 42 µm, 엔코더 7.536 µm, 550 mm/s');
const orot = modeOf('trigger-divider').compute({ imageUm: 42, encoderUm: 7.536, speedMmS: 550, guardUs: 0.1, timerNs: 20 });
check('분주비', orot.divider, 42 / 7.536, 1e-9);
check('최대주파수 Hz', orot.maxFreqHz, 550000 / 7.536, 1e-6);
check('엔코더 주기 µs', orot.periodUs, 13.7018, 1e-3);
// 시트 B13 의 "6분주 사용시 82.25 us" 와 맞아야 한다.
check('6분주 트리거 주기 µs', orot.periodUs * 6, 82.21, 0.05);
check('반올림 분주비', orot.dividerRound, 6, 0);

head('[TDI 정합]  이미지 18.3 µm, 엔코더 2 µm, 분주비 9 로 버림');
const vtdi = { imageUm: 18.3, encoderUm: 2, dividerInt: 9, tdiStages: 256, speedMmS: 300 };
const otdi = modeOf('tdi-alignment').compute(vtdi);
check('이상 분주비', otdi.idealDivider, 9.15, 1e-12);
check('실제 Y 분해능', otdi.actualYUm, 18, 1e-12);
check('스케일러', otdi.scaler, 9 / 9.15, 1e-12);
// 스케일러는 실제 Y 분해능 / 이미지 분해능 과 같아야 한다. 두 경로가 어긋나면 안 된다.
check('스케일러 = 실제 Y / 이미지', otdi.scaler, otdi.actualYUm / 18.3, 1e-12);
check('배율 오차 %', otdi.errorPct, (9 / 9.15 - 1) * 100, 1e-9);
// TDI 는 단수에 비례해 번진다. 64 단과 256 단이 정확히 4 배 차이여야 한다.
check('TDI 256 스미어 px', otdi.smearPx, 256 * (1 - 9 / 9.15), 1e-9);
const otdi64 = modeOf('tdi-alignment').compute({ ...vtdi, tdiStages: 64 });
check('TDI 64 스미어 px', otdi64.smearPx, 64 * (1 - 9 / 9.15), 1e-9);
check('단수 4배면 스미어도 4배', otdi.smearPx, otdi64.smearPx * 4, 1e-9);
check('1 px 허용 단수', otdi.maxStages, Math.floor(1 / (1 - 9 / 9.15)), 0);
check('소프트웨어 트리거 라인레이트', otdi.swLineRate, (300 * 1000) / 18.3, 1e-9);
// 분주비가 정수로 떨어지면 번지지 않아야 한다.
const otdiExact = modeOf('tdi-alignment').compute({ imageUm: 18, encoderUm: 2, dividerInt: 9, tdiStages: 256, speedMmS: 300 });
check('정수 분주비면 스미어 0', otdiExact.smearPx, 0, 1e-12);
check('정수 분주비면 스케일러 1', otdiExact.scaler, 1, 1e-12);
// 이상 분주비는 분주비 계산기와 같아야 한다.
check('분주비 계산기와 일치', otdi.idealDivider,
  modeOf('trigger-divider').compute({ imageUm: 18.3, encoderUm: 2, speedMmS: 300, guardUs: 0.1, timerNs: 20 }).divider, 1e-12);
// 소프트웨어 트리거 라인레이트는 라인스캔 계산기와 같은 식이어야 한다.
check('라인스캔 계산기와 일치', otdi.swLineRate,
  modeOf('line-rate').compute({ speed: 300, umPerLine: 18.3, widthPx: 8192, bitDepth: 8 }).lineRate, 1e-9);
const wtdi = modeOf('tdi-alignment').warn(vtdi, otdi);
line(wtdi.some((w) => w.level === 'danger') ? 'pass' : 'fail',
  `${wtdi.some((w) => w.level === 'danger') ? 'PASS' : 'FAIL'}  스미어 1 px 초과 시 위험 경고`);
if (!wtdi.some((w) => w.level === 'danger')) failed++;

head('[분주비 · 경계]  속도가 너무 빠르면 펄스폭이 남지 않아야 한다');
const vfast = { imageUm: 18, encoderUm: 0.5, speedMmS: 20000, guardUs: 0.1, timerNs: 20 };
const wfast = modeOf('trigger-divider').warn(vfast, modeOf('trigger-divider').compute(vfast));
line(wfast.some((w) => w.level === 'danger') ? 'pass' : 'fail',
  `${wfast.some((w) => w.level === 'danger') ? 'PASS' : 'FAIL'}  주기 < 가드 타임이면 위험 경고`);
if (!wfast.some((w) => w.level === 'danger')) failed++;

head('[용어 사전]  중복·끊긴 링크가 없어야 하고 라벨을 충분히 덮어야 한다');
const glo = await import('./core/glossary.js');
const termIds = glo.TERMS.map((t) => t.id);
const dupIds = [...new Set(termIds.filter((x, i) => termIds.indexOf(x) !== i))];
line(dupIds.length ? 'fail' : 'pass', `${dupIds.length ? 'FAIL' : 'PASS'}  id 중복 없음${dupIds.length ? ': ' + dupIds.join(', ') : ''}`);
if (dupIds.length) failed++;

const brokenLinks = [];
for (const t of glo.TERMS) {
  for (const r of t.related || []) if (!glo.getTerm(r)) brokenLinks.push(`${t.id} → ${r}`);
  if (t.calc && !byId(t.calc)) brokenLinks.push(`${t.id} → 계산기 ${t.calc}`);
}
line(brokenLinks.length ? 'fail' : 'pass', `${brokenLinks.length ? 'FAIL' : 'PASS'}  관련 용어·계산기 링크 실재${brokenLinks.length ? ': ' + brokenLinks.join(', ') : ''}`);
if (brokenLinks.length) failed++;

// 뜻풀이가 비어 있으면 눌러도 볼 것이 없다.
const emptyText = glo.TERMS.filter((t) => !t.short || !t.body || !t.en);
line(emptyText.length ? 'fail' : 'pass', `${emptyText.length ? 'FAIL' : 'PASS'}  모든 용어에 short·body·en 있음${emptyText.length ? ': ' + emptyText.map((t) => t.id).join(', ') : ''}`);
if (emptyText.length) failed++;

// 라벨을 얼마나 덮는지. 남는 것은 대개 "기준 거리" 같은 일상어라 100 % 를 목표로 하지 않는다.
let labelTotal = 0;
let labelCovered = 0;
const notCovered = [];
for (const calc of ALL) {
  for (const mode of calc.modes) {
    for (const f of [...mode.inputs, ...mode.outputs]) {
      labelTotal++;
      if (glo.lookup(f.label) || glo.annotate(f.label, () => {})) labelCovered++;
      else notCovered.push(f.label);
    }
  }
}
const pct = (labelCovered / labelTotal) * 100;
check('라벨 커버리지 %', pct, 80, 100);
line('note', `      덮은 라벨 ${labelCovered} / ${labelTotal}`);
line('note', `      남은 표현 ${[...new Set(notCovered)].length}개 — 일상어는 굳이 등재하지 않는다`);

// 용어 표기가 실제 화면 어딘가에 쓰이는지. 안 쓰이면 밑줄이 생길 자리가 없다.
// 계산기 이름·설명도 포함한다. "비네팅" 처럼 계산기 이름으로만 등장하는 용어가 있다.
const allLabels = ALL.flatMap((c) => [
  c.name,
  c.summary,
  ...(c.tags || []),
  ...c.modes.flatMap((m) => [
    ...m.inputs.map((f) => f.label),
    ...m.outputs.map((o) => o.label),
    ...(Array.isArray(m.formula) ? m.formula : [m.formula]).filter(Boolean),
  ]),
]).join(' | ');
const orphan = glo.TERMS.filter((t) => ![t.term, ...(t.aliases || [])].some((k) => allLabels.includes(k)));
line('note', `      화면에 표기가 없는 용어 ${orphan.length}개${orphan.length ? ': ' + orphan.map((t) => t.term).join(', ') : ''}`);

head('[레지스트리]  모든 계산기가 기본값만으로 계산·도해까지 통과해야 한다');
let broken = 0;
for (const calc of ALL) {
  const modes = calc.modes;
  for (const mode of modes) {
    const values = {};
    for (const f of mode.inputs) values[f.key] = f.default ?? 1;
    try {
      const out = mode.compute(values);
      if (mode.warn) mode.warn(values, out);
      if (mode.diagram) mode.diagram(values, out);
      for (const o of mode.outputs) {
        if (out[o.key] === undefined) throw new Error(`출력 ${o.key} 없음`);
      }
    } catch (err) {
      broken++;
      failed++;
      line('fail', `FAIL  ${calc.id}/${mode.id}: ${err.message}`);
    }
  }
}
line(broken ? 'fail' : 'pass', `${broken ? 'FAIL' : 'PASS'}  계산기 ${ALL.length} 개 / 모드 ${ALL.reduce((n, c) => n + (c.modes ? c.modes.length : 1), 0)} 개 점검`);

head(failed === 0 ? '전체 통과' : `실패 ${failed} 건`);
document.title = failed === 0 ? '검증 통과' : `검증 실패 ${failed}`;
</script>
</body>
</html>
